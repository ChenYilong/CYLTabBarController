<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="820" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect x="20" y="115" width="130" height="60" rx="10" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
  <text x="85" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Tap a tab</text>
  <text x="85" y="160" text-anchor="middle" font-size="12" fill="#444">点击 Tab</text>
  <polygon points="300,95 390,145 300,195 210,145" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="300" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3f87">Needs login</text>
  <text x="300" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#1d3f87">and logged out?</text>
  <rect x="460" y="30" width="330" height="60" rx="10" fill="#edf9ef" stroke="#2f9a46" stroke-width="2"/>
  <text x="625" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6b31">Select the tab (as before)</text>
  <text x="625" y="75" text-anchor="middle" font-size="12" fill="#1f6b31">正常切换 Tab</text>
  <rect x="460" y="120" width="330" height="70" rx="10" fill="#fff4e5" stroke="#d98a00" stroke-width="2"/>
  <text x="625" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4d00">Refuse: no switch, no animation</text>
  <text x="625" y="163" text-anchor="middle" font-size="12" fill="#7a4d00">cyl_loginHandler / delegate shows login</text>
  <text x="625" y="180" text-anchor="middle" font-size="12" fill="#7a4d00">不切换、无动画，弹出登录页</text>
  <rect x="460" y="220" width="155" height="60" rx="10" fill="#edf9ef" stroke="#2f9a46" stroke-width="2"/>
  <text x="537" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6b31">completion(YES)</text>
  <text x="537" y="262" text-anchor="middle" font-size="11" fill="#1f6b31">cache · select tapped tab</text>
  <rect x="635" y="220" width="155" height="60" rx="10" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
  <text x="712" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#222">completion(NO)</text>
  <text x="712" y="262" text-anchor="middle" font-size="11" fill="#444">stay on current tab</text>
  <path d="M150 145 L205 145" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M340 117 C 380 70, 410 60, 455 60" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="392" y="70" font-size="12" fill="#555">No 否</text>
  <path d="M390 145 L455 152" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="402" y="138" font-size="12" fill="#555">Yes 是</text>
  <path d="M560 190 L540 216" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M690 190 L710 216" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>
