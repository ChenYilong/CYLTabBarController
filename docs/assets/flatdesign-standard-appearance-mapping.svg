  <rect x="460" y="40" width="280" height="100" rx="12" fill="#f3f3f3" stroke="#777" stroke-width="2"/>
  <text x="600" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#222">UITabBar</text>
