  <rect x="460" y="190" width="280" height="100" rx="12" fill="#edf9ef" stroke="#2f9a46" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6b31">CYLFlatDesignTabBar</text>
  <text x="600" y="250" text-anchor="middle" font-size="12" fill="#1f6b31">FlatDesign: mirrored by CYLTabBarController</text>
  <text x="600" y="270" text-anchor="middle" font-size="12" fill="#1f6b31">mapped onto its own views</text>
  <path d="M320 120 C 390 100, 400 90, 455 90" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
