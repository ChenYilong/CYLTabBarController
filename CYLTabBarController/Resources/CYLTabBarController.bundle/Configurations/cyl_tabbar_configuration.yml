---
# YAML: flow style, with the list at the same indentation as its key.
# YAML：流式写法，列表与其键保持相同缩进。
CYLTabBarControllerContext: 'CYLConfigurationDemo'
CYLTabBarControllerStyleType: default
CYLTabBarControllerImageInsets: '{0, 0, 0, 0}'
CYLTabBarControllerTitlePositionAdjustment: '{0, -2}'
CYLTabBarControllerNavigationControllerClass: UINavigationController
CYLTabBarControllerTabBarItemsAttributes:
- {CYLTabBarItemTitle: YML, CYLTabBarItemImage: "system:house", CYLTabBarItemSelectedImage: "system:house.fill",
   CYLTabBarItemIdentifier: home, CYLTabBarItemViewControllerClass: UIViewController}
- {CYLTabBarItemTitle: Message, CYLTabBarItemImage: "system:message", CYLTabBarItemSelectedImage: "system:message.fill", CYLTabBarItemIdentifier: message, CYLTabBarItemViewControllerClass: UIViewController}
- {CYLTabBarItemTitle: Discover, CYLTabBarItemImage: "system:safari", CYLTabBarItemSelectedImage: "system:safari.fill", CYLTabBarItemIdentifier: discover, CYLTabBarItemViewControllerClass: UIViewController, CYLTabBarItemImageInsets: "{1, 0, -1, 0}"}
- {CYLTabBarItemTitle: Me, CYLTabBarItemImage: "system:person", CYLTabBarItemSelectedImage: "system:person.fill", CYLTabBarItemIdentifier: me, CYLTabBarItemViewControllerClass: UIViewController, CYLTabBarItemTitlePositionAdjustment: "{0, -1}"}
...
