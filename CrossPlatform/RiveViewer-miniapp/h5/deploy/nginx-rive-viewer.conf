location = /rive-viewer {
    return 308 /rive-viewer/;
}

location = /rive-viewer/index.html {
    root /var/www/rive-viewer/current;
    expires -1;
    add_header Cache-Control "no-cache" always;
}

location = /rive-viewer/rive-2.39.1.wasm {
    root /var/www/rive-viewer/current;
    default_type application/wasm;
    gzip_static on;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /rive-viewer/rive-webgl2-2.39.1.wasm {
    root /var/www/rive-viewer/current;
    default_type application/wasm;
    gzip_static on;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /rive-viewer/assets/ {
    root /var/www/rive-viewer/current;
    gzip_static on;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /rive-viewer/ {
    root /var/www/rive-viewer/current;
    try_files $uri $uri/ /rive-viewer/index.html;
    gzip_static on;
    expires 7d;
}
