map "$request_method:$uri" $rive_host_upload_key {
    default "";
    "~^POST:/api/v1/shares(?:/[0-9A-Za-z]{3}/versions)?$" $binary_remote_addr;
}

map $request_method $rive_host_write_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $rive_host_upload_key zone=rive_host_uploads:10m rate=6r/m;
limit_req_zone $rive_host_write_key zone=rive_host_writes:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=rive_host_connections:10m;

upstream rive_host_api {
    server 127.0.0.1:8097;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name rive.mikeywa.site;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rive.mikeywa.site;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/rive.mikeywa.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rive.mikeywa.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/rive-host/current;
    index index.html;
    charset utf-8;
    client_max_body_size 64m;
    client_body_timeout 120s;

    access_log /var/log/nginx/rive-host.access.log;
    error_log /var/log/nginx/rive-host.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        proxy_pass http://rive_host_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /api {
        limit_req zone=rive_host_writes burst=20 nodelay;
        limit_conn rive_host_connections 20;
        limit_req_status 429;
        proxy_pass http://rive_host_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location ^~ /api/ {
        limit_req zone=rive_host_uploads burst=6 nodelay;
        limit_req zone=rive_host_writes burst=20 nodelay;
        limit_conn rive_host_connections 20;
        limit_req_status 429;
        proxy_pass http://rive_host_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /rive-2.39.1.wasm {
        try_files $uri =404;
        default_type application/wasm;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /rive-webgl2-2.39.1.wasm {
        try_files $uri =404;
        default_type application/wasm;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ^~ /samples/ {
        return 404;
    }

    location = /samples {
        return 404;
    }

    location = /s {
        return 308 /;
    }

    location ~ "^/s/([0-9A-Za-z]{3})/?$" {
        return 308 /$1$is_args$args;
    }

    location /s/ {
        return 404;
    }

    location ~ "^/[0-9A-Za-z]{3}/?$" {
        rewrite ^ /index.html last;
    }

    location / {
        try_files $uri $uri/ /index.html;
        gzip_static on;
        expires 7d;
    }
}
