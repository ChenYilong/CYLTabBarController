# Versions of the Android demo, in one place. Android 演示的版本号，集中在此。
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
appcompat = "1.7.0"
fragment = "1.8.5"
material = "1.12.0"
json = "20240303"
android-library = "8.7.3"
robolectric = "4.14.1"
junit = "4.13.2"
lottie = "6.6.2"
libpag = "4.5.98"
rive = "10.3.0"
svgaplayer = "2.6.1"
androidx-test-core = "1.6.1"
viewpager2 = "1.0.0"
# [EN] A commit of CYLDeallocBlockExecutor (JitPack). TODO: replace with a release once the library is published to Maven Central (see cyltabbar/build.gradle.kts). [CN] CYLDeallocBlockExecutor 的某次提交（JitPack）。TODO：库发布到 Maven Central 后改为正式版本（见 cyltabbar/build.gradle.kts）。
cyldeallocblockexecutor = "6aef46d97fb79a4530931d84a17e828c67f35444"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
material = { module = "com.google.android.material:material", version.ref = "material" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit = { module = "junit:junit", version.ref = "junit" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
libpag = { module = "com.tencent.tav:libpag", version.ref = "libpag" }
rive = { module = "app.rive:rive-android", version.ref = "rive" }
svgaplayer = { module = "com.github.yyued:SVGAPlayer-Android", version.ref = "svgaplayer" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
cyldeallocblockexecutor = { module = "com.github.ChenYilong.CYLDeallocBlockExecutor:cyl-dealloc-block-executor-core", version.ref = "cyldeallocblockexecutor" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
