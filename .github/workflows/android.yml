# [EN] Android CI: the Gradle build of Example-Android (the `cyltabbar` library, `tabpages`, `demokit` and the four demo
#      apps) on a Linux runner: unit tests (Robolectric), lint, release builds (R8), and the Maven bundle of
#      scripts/publish-android.sh (built and checked, not uploaded). See docs/Android-Library.md.
#      Run the same locally with: cd Example-Android && LC_ALL=C.UTF-8 gradle testDebugUnitTest :tabpages:test lintDebug assembleRelease
# [CN] Android CI：在 Linux runner 上用 Gradle 构建 Example-Android（`cyltabbar` 库、`tabpages`、`demokit` 与四个演示 App）：单元测试
#      （Robolectric）、lint、release 构建（R8），以及 scripts/publish-android.sh 的 Maven 上传包（构建并检查，不上传）。见 docs/Android-Library.md。
#      本地运行：cd Example-Android && LC_ALL=C.UTF-8 gradle testDebugUnitTest :tabpages:test lintDebug assembleRelease
name: Android

on:
  pull_request:
    paths:
      - "Example-Android/**"
      - "CYLTabBarController/Resources/CYLTabBarController.bundle/**"
      - "Example-*/**/*.xcassets/**"
      - "scripts/publish-android.sh"
      - "scripts/configuration-tests/**"
      - ".github/workflows/android.yml"
  push:
    branches: [master]
    paths:
      - "Example-Android/**"
      - "CYLTabBarController/Resources/CYLTabBarController.bundle/**"
      - "Example-*/**/*.xcassets/**"
      - "scripts/publish-android.sh"
      - "scripts/configuration-tests/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # [EN] Asset names of the PAG example are not ASCII (docs/Android-Examples.md). [CN] PAG 示例的资源名不是 ASCII（docs/Android-Examples.md）。
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Unit tests, lint and release builds 单元测试、lint 与 release 构建
        run: gradle -p Example-Android --console=plain testDebugUnitTest :tabpages:test lintDebug assembleRelease
      - name: Maven bundle 发布包
        run: scripts/publish-android.sh staging --skip-tests
      - name: Reports 报告
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            Example-Android/*/build/reports/
            Example-Android/*/build/test-results/
          if-no-files-found: ignore
