# [EN] Android CI: the Gradle build of Example-Android (the `cyltabbar` library, `tabpages`, `demokit` and the four demo
#      apps) on a Linux runner: unit tests (Robolectric), lint, release builds (R8), and the Maven bundle of
#      scripts/publish-android.sh (built and checked, not uploaded). See docs/Android-Library.md.
#      Run the same locally with: cd Example-Android && LC_ALL=C.UTF-8 gradle testDebugUnitTest :tabpages:test lintDebug assembleRelease
# [CN] Android CI：在 Linux runner 上用 Gradle 构建 Example-Android（`cyltabbar` 库、`tabpages`、`demokit` 与四个演示 App）：单元测试
#      （Robolectric）、lint、release 构建（R8），以及 scripts/publish-android.sh 的 Maven 上传包（构建并检查，不上传）。见 docs/Android-Library.md。
#      本地运行：cd Example-Android && LC_ALL=C.UTF-8 gradle testDebugUnitTest :tabpages:test lintDebug assembleRelease
name: Android

on:
  pull_request:
    paths:
      - "Example-Android/**"
      - "CYLTabBarController/Resources/CYLTabBarController.bundle/**"
      - "Example-*/**/*.xcassets/**"
      - "scripts/publish-android.sh"
      - "scripts/configuration-tests/**"
      - ".github/workflows/android.yml"
  push:
    branches: [master]
    paths:
      - "Example-Android/**"
      - "CYLTabBarController/Resources/CYLTabBarController.bundle/**"
      - "Example-*/**/*.xcassets/**"
      - "scripts/publish-android.sh"
      - "scripts/configuration-tests/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # [EN] Asset names of the PAG example are not ASCII (docs/Android-Examples.md). [CN] PAG 示例的资源名不是 ASCII（docs/Android-Examples.md）。
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      # [EN] Maven Central sometimes answers 429 Too Many Requests to shared runners (run 44404316209: kotlin-reflect on the
      #      build classpath). Configuring the build resolves the classpath and the plugins; try it up to three times with
      #      a pause, so a rate limit does not fail the job. A real build error still fails the next step.
      # [CN] Maven Central 有时会对共享 runner 返回 429 Too Many Requests（run 44404316209：构建 classpath 中的 kotlin-reflect）。
      #      配置构建会解析 classpath 与插件；最多尝试三次并在中间等待，避免限流导致任务失败。真正的构建错误仍会让下一步失败。
      - name: Resolve the build classpath (retried) 解析构建 classpath（重试）
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle -p Example-Android --console=plain help; then
              exit 0
            fi
            echo "Gradle configuration failed (attempt ${attempt}); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1
      # [EN] The same 429 hits the artifacts the tests download only when they run (Robolectric's nativeruntime-dist-compat jar,
      #      runs 45077540911 and 45081008576), which the step above does not resolve. Retry the build only when its log says
      #      "Too Many Requests"; Gradle keeps what it downloaded, so a retry fetches only what is missing. A test or lint
      #      failure does not match and fails at once.
      # [CN] 同样的 429 也会出现在测试运行时才下载的构件上（Robolectric 的 nativeruntime-dist-compat jar，run 45077540911 与 45081008576），
      #      上一步不会解析它们。只有构建日志出现 "Too Many Requests" 时才重试；Gradle 会保留已下载的内容，重试只获取缺少的部分。
      #      测试或 lint 失败不会匹配，会立即失败。
      - name: Unit tests, lint and release builds (retried on a rate limit) 单元测试、lint 与 release 构建（限流时重试）
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if gradle -p Example-Android --console=plain testDebugUnitTest :tabpages:test lintDebug assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
              exit 0
            fi
            if ! grep -q "Too Many Requests" "$RUNNER_TEMP/gradle.log"; then
              exit 1
            fi
            echo "Maven Central rate limit (attempt ${attempt}); retrying in $((attempt * 45)) s"
            sleep $((attempt * 45))
          done
          exit 1
      - name: Maven bundle 发布包
        run: scripts/publish-android.sh staging --skip-tests
      - name: Reports 报告
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            Example-Android/*/build/reports/
            Example-Android/*/build/test-results/
          if-no-files-found: ignore
