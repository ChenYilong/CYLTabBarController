# Fails when the documentation navigation or the doc-class bindings are out of date.
# Fix it locally with: python3 scripts/update-docs-navigation.py
name: Docs navigation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "CYLTabBarController/**/*.h"
      - "scripts/update-docs-navigation.py"
      - "scripts/sync-agent-skills.py"
      - "scripts/sync-example-shared.py"
      - "scripts/android-library-strings.py"
      - "CYLTabBarController/Resources/**"
      - "CrossPlatform/**"
      - ".agents/**"
      - ".claude/**"
      - "Example*/**"
  push:
    branches: [master]
    paths:
      - "README.md"
      - "docs/**"
      - "CYLTabBarController/**/*.h"
      - "scripts/update-docs-navigation.py"
      - "scripts/sync-agent-skills.py"
      - "scripts/sync-example-shared.py"
      - "scripts/android-library-strings.py"
      - "CYLTabBarController/Resources/**"
      - "CrossPlatform/**"
      - ".agents/**"
      - ".claude/**"
      - "Example*/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the navigation
        run: python3 scripts/update-docs-navigation.py --check
      - name: Check the agent skills
        run: python3 scripts/sync-agent-skills.py --check
      # [EN] Copies generated from the library's string tables and Example-Shared. [CN] 由库的字符串表与 Example-Shared 生成的副本。
      - name: Check the examples' shared data and translations
        run: python3 scripts/sync-example-shared.py --check
      - name: Check the Android library strings
        run: python3 scripts/android-library-strings.py --check
