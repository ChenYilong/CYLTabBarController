# [EN] Release on a version tag (e.g. 1.99.73), on a GitHub-hosted xcode-27 macOS runner. See docs/Mac-CI-CD.md.
#      1. The tag must equal `s.version` in CYLTabBarController.podspec.
#      2. `scripts/pod-lint.sh push`: `pod trunk push` with the COCOAPODS_TRUNK_TOKEN secret, then the Carthage and SPM
#         versions in the demo and the docs move to the new version.
#      3. A GitHub Release with generated notes.
#      4. A pull request with the files step 2 changed.
# [CN] 推送版本 tag（如 1.99.73）时发布，运行在 GitHub 托管的 xcode-27 macOS runner 上。见 docs/Mac-CI-CD.md。
#      1. tag 必须等于 CYLTabBarController.podspec 中的 `s.version`。
#      2. `scripts/pod-lint.sh push`：使用 Secret COCOAPODS_TRUNK_TOKEN 执行 `pod trunk push`，然后把 Demo 与文档中 Carthage、SPM 的版本号
#         更新为新版本。
#      3. 创建 GitHub Release（自动生成说明）。
#      4. 为第 2 步修改的文件开一个 PR。
name: Release

on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches the podspec version
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*s\.version[[:space:]]*=[[:space:]]*["'\'']\([^"'\'']*\)["'\''].*/\1/p' CYLTabBarController.podspec | head -n 1)
          echo "podspec: $VERSION, tag: $TAG"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "::error::The tag $TAG does not match s.version $VERSION in CYLTabBarController.podspec. Bump s.version on master first, then tag that commit."
            exit 1
          fi

      - name: Versions
        run: |
          xcodebuild -version
          pod --version || sudo gem install cocoapods

      - name: Publish to CocoaPods trunk, then update the Carthage and SPM versions
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [[ -z "$COCOAPODS_TRUNK_TOKEN" ]]; then
            echo "::error::The repository secret COCOAPODS_TRUNK_TOKEN is not set."
            exit 1
          fi
          scripts/pod-lint.sh push

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi

      # [EN] The version updates of step 2 go to master through a pull request (master may be protected).
      #      Needs "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General); without it
      #      the branch is still pushed and the step prints a link to open the pull request by hand.
      # [CN] 第 2 步的版本号更新通过 PR 进入 master（master 可能受保护）。需要开启「Allow GitHub Actions to create and approve pull
      #      requests」（Settings → Actions → General）；未开启时仍会推送分支，并输出手动创建 PR 的链接。
      - name: Pull request with the version updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No version files changed."
            exit 0
          fi
          BRANCH="release/$TAG-versions"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: 🔖 Carthage and SPM versions for $TAG"
          git push origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "chore: 🔖 Carthage and SPM versions for $TAG" \
            --body "Automatic version updates after publishing $TAG to CocoaPods (\`scripts/pod-lint.sh push\`)." \
            || echo "::warning::Could not open the pull request. Open it by hand: https://github.com/${{ github.repository }}/compare/master...$BRANCH"
