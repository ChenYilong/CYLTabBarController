# Vendored third-party agent skills are not this project's code.
# [EN] Lock files ending in .lock (pubspec.lock, Gemfile.lock, yarn.lock, Podfile.lock) are never committed (AGENTS.md),
#      so the manifests they would lock are not analyzed: Sonar's only findings there are "lock file is missing"
#      (text:S8564 package.json, text:S8568 Gemfile, text:S8571 pubspec.yaml). Gradle's gradle.lockfile is committed.
# [CN] 以 .lock 结尾的锁文件（pubspec.lock、Gemfile.lock、yarn.lock、Podfile.lock）不提交（见 AGENTS.md），因此不分析它们所锁定的清单文件：
#      Sonar 在这些文件上只会报告“缺少锁文件”（text:S8564 package.json、text:S8568 Gemfile、text:S8571 pubspec.yaml）。Gradle 的
#      gradle.lockfile 会提交。
# [EN] Not this project's code, so not analyzed: the vendored runtimes of the mini program animation packages, copied
#      unchanged (libpag-miniprogram 4.5.85 by Tencent, the Rive canvas runtime; see their NOTICE / LICENSE), the build
#      output of cyl-lottie-miniprogram (its src/ is analyzed), and the files the WeChat example generates from
#      Example-Shared (example/scripts/cyl_sync_shared.js; the path once lacked `example/`, so they were analyzed).
# [CN] 不是本项目的代码，因此不分析：小程序动画包中原样复制的第三方运行时（腾讯的 libpag-miniprogram 4.5.85、Rive canvas
#      运行时；见其 NOTICE / LICENSE）、cyl-lottie-miniprogram 的构建产物（分析其 src/），以及微信示例从 Example-Shared 生成的
#      文件（example/scripts/cyl_sync_shared.js；该路径曾缺少 `example/`，因此被分析）。
# [EN] The vendored copies of CYLDeallocBlockExecutor (scripts/sync-cyldeallocblockexecutor.sh, never edited here) are the
#      library's code, not this project's; they also duplicate each other's registry logic across languages.
# [CN] CYLDeallocBlockExecutor 的外部副本（scripts/sync-cyldeallocblockexecutor.sh 生成，不在此处修改）是库的代码，不是本项目的代码；
#      两种语言的副本还含有相同的注册表逻辑。
# [EN] Deprecated Swift forwards (the old names of the renamed public API, each one calls its lowerCamelCase replacement) are
#      kept for source compatibility and removed at the next major version, so SonarCloud does not analyze them (their
#      names are the findings the rename removed from the code); docs/Swift-Coding-Style.md, "Sonar naming rename".
# [CN] 已废弃的 Swift 转发（已改名公开 API 的旧名称，每个都调用其 lowerCamelCase 的新名称）为保持源码兼容而保留，并在下一个主版本移除，
#      因此 SonarCloud 不分析它们（它们的名称正是改名后从代码中消除的问题）；见 docs/Swift-Coding-Style.md“Sonar naming rename”。
sonar.exclusions=.agents/**,CrossPlatform/harmonyos-cyltabbar/cyldeallocblockexecutor/**,CrossPlatform/wechat-miniprogram-cyltabbar/src/cyl-dealloc-block-executor/**,**/package.json,**/Gemfile,**/pubspec.yaml,CrossPlatform/wechat-miniprogram-cyltabbar/example/miniprogram/shared/**,CrossPlatform/pag-miniprogram/miniprogram_dist/libpag/**,CrossPlatform/rive-miniprogram/miniprogram_dist/rive/**,CrossPlatform/lottie-miniprogram/miniprogram_dist/**,CYLTabBarController/Swift/Deprecated/**,CYLTabBarController/CYLBadgeView/Swift/Deprecated/**,CYLTabBarController/CYLUtils/Swift/Deprecated/**,CYLTabBarController/CYLFlatDesignTabBar/CYLFlatDesignTabBar-ObjectiveC/Swift/Deprecated/**
# [EN] String tables (one key per line, the same keys in every language) are data: no duplication check.
# [CN] 字符串表（每行一个键，每种语言的键相同）是数据：不做重复检查。
sonar.cpd.exclusions=CrossPlatform/wechat-miniprogram-cyltabbar/example/miniprogram/utils/cyl_demo_strings.js
