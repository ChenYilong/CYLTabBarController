# Vendored third-party agent skills are not this project's code.
# [EN] Lock files ending in .lock (pubspec.lock, Gemfile.lock, yarn.lock, Podfile.lock) are never committed (AGENTS.md),
#      so the manifests they would lock are not analyzed: Sonar's only findings there are "lock file is missing"
#      (text:S8564 package.json, text:S8568 Gemfile, text:S8571 pubspec.yaml). Gradle's gradle.lockfile is committed.
# [CN] 以 .lock 结尾的锁文件（pubspec.lock、Gemfile.lock、yarn.lock、Podfile.lock）不提交（见 AGENTS.md），因此不分析它们所锁定的清单文件：
#      Sonar 在这些文件上只会报告“缺少锁文件”（text:S8564 package.json、text:S8568 Gemfile、text:S8571 pubspec.yaml）。Gradle 的
#      gradle.lockfile 会提交。
sonar.exclusions=.agents/**,**/package.json,**/Gemfile,**/pubspec.yaml
