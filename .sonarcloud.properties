# Vendored third-party agent skills are not this project's code.
sonar.exclusions=.agents/**

# [EN] Lock files ending in .lock (pubspec.lock, Gemfile.lock, yarn.lock, Podfile.lock) are never committed (AGENTS.md),
#      so the "lock file is missing" rules for them do not apply. Gradle's gradle.lockfile is committed (S8569 stays on).
# [CN] 以 .lock 结尾的锁文件（pubspec.lock、Gemfile.lock、yarn.lock、Podfile.lock）不提交（见 AGENTS.md），因此对应的“缺少锁文件”规则不适用。
#      Gradle 的 gradle.lockfile 会提交（S8569 保持开启）。
sonar.issue.ignore.multicriteria=lockGemfile,lockPubspec
sonar.issue.ignore.multicriteria.lockGemfile.ruleKey=text:S8568
sonar.issue.ignore.multicriteria.lockGemfile.resourceKey=**/*
sonar.issue.ignore.multicriteria.lockPubspec.ruleKey=text:S8571
sonar.issue.ignore.multicriteria.lockPubspec.resourceKey=**/*
