---
# YAML: flow style, with the list at the same indentation as its key.
# YAML：流式写法，列表与其键保持相同缩进。
CYLTabBarControllerContext: 'CYLConfigurationDemo'
CYLTabBarControllerLocalization:
  CYLTabBarLocalizationTableName: ConfigurationDemo
  CYLTabBarLocalizationPath: Localization
CYLTabBarControllerStyleType: default
CYLTabBarControllerImageInsets: '{0, 0, 0, 0}'
CYLTabBarControllerTitlePositionAdjustment: '{0, -2}'
CYLTabBarControllerThemeManagerName: CYLConfigurationDemo
CYLTabBarControllerThemeIdentifier: light
CYLTabBarControllerDarkThemeIdentifier: dark
CYLTabBarControllerThemes:
  light:
    CYLTabBarItemSelectedTitleColor: "#007AFF"
    CYLTabBarItemSelectedIconColor: "#007AFF"
  dark:
    CYLTabBarItemSelectedTitleColor: "#0A84FF"
    CYLTabBarItemSelectedIconColor: "#0A84FF"
    CYLTabBarBackgroundColor: "#1C1C1E"
CYLTabBarControllerTabBarItemsAttributes:
- {CYLTabBarItemTitle: YML, CYLTabBarItemImage: "system:house", CYLTabBarItemSelectedImage: "system:house.fill",
   CYLTabBarItemIdentifier: home}
- {CYLTabBarItemTitle: Message, CYLTabBarItemImage: "system:message", CYLTabBarItemSelectedImage: "system:message.fill", CYLTabBarItemIdentifier: message, CYLTabBarItemPlatforms: "ios,android"}
- {CYLTabBarItemTitle: Discover, CYLTabBarItemImage: "system:safari", CYLTabBarItemSelectedImage: "system:safari.fill", CYLTabBarItemIdentifier: discover, CYLTabBarItemPageIdentifier: web, CYLTabBarItemPageParameters: {url: "https://github.com/ChenYilong/CYLTabBarController"}, CYLTabBarItemImageInsets: "{1, 0, -1, 0}"}
- {CYLTabBarItemTitle: Me, CYLTabBarItemImage: "system:person", CYLTabBarItemSelectedImage: "system:person.fill", CYLTabBarItemIdentifier: me, CYLTabBarItemMinimumAppVersion: "1.0.0", CYLTabBarItemTitlePositionAdjustment: "{0, -1}"}
...
